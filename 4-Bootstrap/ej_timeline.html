<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline - Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <style>
        /* Avatares de los integrantes */
        .avatar {
            width: 45px;
            height: 45px;
            object-fit: cover;
        }
    </style>
</head>
<body>

<div class="container mt-5 border">

    <!-- Meses -->
    <div class="row bg-black text-white">
        <div class="col-6 text-center fw-bold fs-5 py-2">Enero</div>
        <div class="col-6 text-center fw-bold fs-5 py-2">Febrero</div>
    </div>

    <!-- Semanas -->
    <div class="row bg-black text-white">
        <div class="col text-center border border-light">Semana 1</div>
        <div class="col text-center border border-light">Semana 2</div>
        <div class="col text-center border border-light">Semana 3</div>
        <div class="col text-center border border-light">Semana 4</div>
        <div class="col text-center border border-light">Semana 1</div>
        <div class="col text-center border border-light">Semana 2</div>
        <div class="col text-center border border-light">Semana 3</div>
        <div class="col text-center border border-light">Semana 4</div>
    </div>

    <!-- Tareas -->
    <div class="py-4">

        <div class="row mb-3">
            <div class="col-5">
                <div class="bg-secondary text-white rounded-2 p-3 d-flex justify-content-between align-items-center">
                    <div>
                        <span class="text-info">Completed</span>
                        <h4 class="fw-bold mb-1">Define Architecture</h4>
                        <span class="opacity-50">20 Enero</span>
                    </div>
                    <div class="d-flex gap-1">
                        <img class="avatar rounded-circle border border-light" src="imagenes/icono_usuario.jpg" alt="Integrante 1">
                        <img class="avatar rounded-circle border border-light" src="imagenes/icono_usuario.jpg" alt="Integrante 2">
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-5 offset-3">
                <div class="bg-secondary text-white rounded-2 p-3 d-flex justify-content-between align-items-center">
                    <div>
                        <span class="text-warning">In Progress</span>
                        <h4 class="fw-bold mb-1">Define Architecture</h4>
                        <span class="opacity-50">20 Enero</span>
                    </div>
                    <div class="d-flex gap-1">
                        <img class="avatar rounded-circle border border-light" src="imagenes/icono_usuario.jpg" alt="Integrante 1">
                        <img class="avatar rounded-circle border border-light" src="imagenes/icono_usuario.jpg" alt="Integrante 2">
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-5 offset-5">
                <div class="bg-secondary text-white rounded-2 p-3 d-flex justify-content-between align-items-center">
                    <div>
                        <span class="text-danger">Blocked</span>
                        <h4 class="fw-bold mb-1">Define Architecture</h4>
                        <span class="opacity-50">20 Enero</span>
                    </div>
                    <div class="d-flex gap-1">
                        <img class="avatar rounded-circle border border-light" src="imagenes/icono_usuario.jpg" alt="Integrante 1">
                        <img class="avatar rounded-circle border border-light" src="imagenes/icono_usuario.jpg" alt="Integrante 2">
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
