<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <style>
        .card-perfil {
            width: 18rem;
        }

        /* Portada */
        .card-perfil .card-img-top {
            height: 140px;
            object-fit: cover;
        }

        /* Foto de perfil superpuesta sobre la portada */
        .profile img {
            width: 110px;
            height: 110px;
            margin-top: -70px;
            object-fit: cover;
            background-color: #fff;
            border: 3px solid #fff;
        }

        .material-symbols-outlined {
            font-size: 20px;
        }
    </style>
</head>
<body>

<div class="d-flex justify-content-center my-5">
    <div class="card card-perfil">
        <img class="card-img-top" src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/fondo_mario.jpg" alt="Portada">

        <div class="profile position-relative text-center">
            <img class="rounded-circle" src="imagenes/icono_usuario.jpg" alt="Foto de perfil">
        </div>

        <div class="card-body text-center pt-2">
            <h5 class="card-title fw-bold">Bautista Maldonado</h5>
            <p class="card-text">
                Lorem ipsum dolor sit amet, consectetur adipiscing elit. In pulvinar lacus risus, et convallis ante
                sodales eget. Nulla ornare dui non tellus varius tincidunt.
            </p>
            <a href="#" class="btn btn-primary">Ver perfil</a>
        </div>

        <div class="list-group list-group-flush">
            <a href="#" class="list-group-item list-group-item-action d-flex align-items-center gap-2">
                <span class="material-symbols-outlined">chat_bubble</span>
                Ir a mensajes
            </a>
            <a href="#" class="list-group-item list-group-item-action d-flex align-items-center gap-2">
                <span class="material-symbols-outlined">notifications</span>
                Notificaciones
                <span class="badge bg-danger">+99</span>
            </a>
            <a href="#" class="list-group-item list-group-item-action d-flex align-items-center gap-2">
                <span class="material-symbols-outlined">group</span>
                Solicitudes Pendientes
            </a>
            <a href="#" class="list-group-item list-group-item-action d-flex align-items-center gap-2">
                <span class="material-symbols-outlined">videocam</span>
                Llamar
            </a>
        </div>
    </div>
</div>

</body>
</html>
